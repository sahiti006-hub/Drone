<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>403 Forbidden | Smart Emergency Drone System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background-color: var(--bg-app); display: flex; align-items: center; justify-content: center; min-height: 100vh;">
  <div class="auth-card" style="text-align: center;">
    <div style="font-size: 3rem; margin-bottom: 12px;">🚫</div>
    <h2 style="font-size: 1.5rem; font-weight: 800; color: #0f172a; margin-bottom: 8px;">403 - Access Denied</h2>
    <p style="color: #64748b; font-size: 0.95rem; margin-bottom: 24px;">
      {{ error.description if error and error.description else "You do not have the required role privileges to access this operational resource or another user's delivery order." }}
    </p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary" style="width: 100%;">Return to Authorized Dashboard</a>
  </div>
</body>
</html>
