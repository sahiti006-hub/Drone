# ==============================================================================
# Smart Emergency Drone Delivery System - Docker Compose Deployment
# ==============================================================================
# Reproducible academic evaluation and production-grade container orchestration.
#
# Startup Command:
#   docker compose up --build -d
#
# View Logs:
#   docker compose logs -f app
#
# Teardown:
#   docker compose down (or 'docker compose down -v' to clear data volumes)
# ==============================================================================

version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: emergency_drone_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be configured in .env}
      MYSQL_DATABASE: ${DB_NAME:-smart_emergency_drone_db}
      MYSQL_USER: ${DB_USER:-drone_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be configured in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    # Security hardening: bind MySQL only to localhost (127.0.0.1) on the host machine
    # to prevent exposing the database over public network interfaces.
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - drone_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emergency_drone_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-5000}:5000"
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: 0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be configured in .env}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-drone_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be configured in .env}
      DB_NAME: ${DB_NAME:-smart_emergency_drone_db}
      USE_PROXY_FIX: ${USE_PROXY_FIX:-1}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      ADMIN_NAME: ${ADMIN_NAME:-System Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@emergencydrone.org}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - drone_network

volumes:
  mysql_data:
    name: emergency_drone_mysql_data

networks:
  drone_network:
    name: emergency_drone_network
    driver: bridge
